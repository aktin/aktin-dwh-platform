version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      java:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
