min_version: 2.0.5

# Shared hooks: data file guard, large files, commit size, commit message.
# Change git_url and ref to use another source or pin a version.
remotes:
  - git_url: https://github.com/aktin/aktin-github-scripts
    ref: main
    refetch_frequency: 24h
    configs:
      - hooks/lefthook.yml

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.java"
      run: ./mvnw -q spotless:apply -DspotlessFiles="$(printf '.*/%s,' {staged_files} | sed 's/,$//')"
      stage_fixed: true
    lint:
      glob: "*.java"
      run: ./mvnw -q checkstyle:check -Dcheckstyle.includes="$(for f in {staged_files}; do printf '**/%s,' "$(basename "$f")"; done | sed 's/,$//')"
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --verbose
        else
          echo "gitleaks not installed, skipping secret scan"
        fi

pre-push:
  commands:
    verify:
      run: ./mvnw -B verify
